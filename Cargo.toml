[workspace]
members = [
    "server",
    "pilot",
    "agent",
    "crates/graph",
    "crates/event",
    "crates/runtime",
    "crates/scheduler",
    "crates/coordinator",
    "crates/catalog",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
event = {path = "crates/event"}
graph = {path = "crates/graph"}
runtime = {path = "crates/runtime"}
scheduler = {path = "crates/scheduler"}
coordinator = {path = "crates/coordinator", default-features = false}
catalog = {path = "crates/catalog"}
axum = "0.8"
fastrand = "2"
futures-util = "0.3"
bollard = "0.21"
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
toasty = { version = "0.11", features = ["mysql", "serde", "jiff"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
jiff = { version = "0.2", features = ["serde"] }
tokio = { version = "1.53", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
